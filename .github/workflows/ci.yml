name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -p .

      - name: Unit tests
        run: npx vitest run

      - name: Simulator smoke test
        run: npm run sim -- smoke --gate

      - name: Production build
        run: npm run build

      - name: Intervention and alternative-party gates
        run: |
          npm run balance:orders -- --seeds 200 --quick --gate
          npm run balance:viability -- --seeds 200 --gate

      - name: Paid company campaign gate
        run: npm run campaign -- --runs 75 --gate

      - name: Install desktop test browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Production runtime checks
        run: npm run test:build

      - name: Desktop browser checks
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x1000x24" npm run test:browser
        env:
          APS_BROWSERS: chromium,firefox
          APS_FIREFOX_HEADED: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-release-evidence
          path: reports/
